# Kit de démarrage Bouquineo — PostgreSQL conteneurisé (cible du pipeline).
# Lancement : docker compose up -d
# Arrêt     : docker compose down          (ajouter -v pour purger les données)
services:
  postgres:
    image: postgres:16
    container_name: bouquineo_pg
    environment:
      POSTGRES_USER: bouquineo
      POSTGRES_PASSWORD: bouquineo
      POSTGRES_DB: bouquineo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bouquineo -d bouquineo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
